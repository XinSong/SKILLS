[project]
name = "knowledge-compiler-skill"
version = "0.2.0"
description = "Evidence-grounded, algorithm-first knowledge compiler for local Markdown"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py>=4.0,<5",
  "networkx>=3.4,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.13,<4",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.135,<7",
  "pytest>=8.4,<9",
]

[project.scripts]
knowledge-compiler = "knowledge_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_compiler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
